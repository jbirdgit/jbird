plugins {
    id "com.android.application"
}

android {
    namespace "bg.parking.sms"
    compileSdk 35

    defaultConfig {
        applicationId "bg.parking.sms"
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName "1.1"
    }

    // Ключът е в хранилището, за да може всяка нова версия да се инсталира
    // върху старата. Ползва се само за това лично приложение.
    signingConfigs {
        release {
            storeFile file("release.keystore")
            storePassword "parkingsms"
            keyAlias "parking"
            keyPassword "parkingsms"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
